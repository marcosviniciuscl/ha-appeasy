<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ef">
  <title>HA Concierge</title>
  <link rel="stylesheet" href="./static/style.css">
  <script defer src="./static/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">⌂</span><div><strong id="brandName">Concierge</strong><small>CASA EM PERSPECTIVA</small></div></div>
      <nav id="nav" aria-label="Navegação principal">
        <button data-page="overview" class="active">Visão geral</button>
        <button data-page="monitor">Monitoramento</button>
        <button data-page="activity">Atividade</button>
        <button data-page="assistant">Assistente</button>
        <button data-page="automations">Automações</button>
        <button data-page="memory">Memória</button>
        <button data-page="settings">Configurações</button>
      </nav>
      <div class="side-foot"><span class="status-dot"></span><span id="connection">Conectando...</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><span id="crumb">Visão geral</span><span id="clock"></span></header>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="content"></div>
    </main>
  </div>
  <div id="onboarding" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="welcome card">
      <span class="eyebrow">BEM-VINDO À SUA CASA</span>
      <h1 id="welcomeTitle">Como posso me chamar?</h1>
      <p>Começamos com uma leitura da casa cadastrada no Home Assistant. Você escolhe o que deseja acompanhar depois.</p>
      <label for="firstName">Nome do assistente</label>
      <input id="firstName" maxlength="40" value="Concierge" autocomplete="off">
      <label for="residentName">Como devo chamar você? <span class="muted">Opcional</span></label>
      <input id="residentName" maxlength="40" placeholder="Pode deixar em branco">
      <button id="begin" class="primary">Conhecer minha casa <span aria-hidden="true">→</span></button>
    </div>
  </div>
</body>
</html>
