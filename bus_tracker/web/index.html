<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Bus Tracker</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{
    --bg:#0e1014; --card:#171a21; --card2:#1e222b; --linha:rgba(255,255,255,.09);
    --txt:#e9ecf2; --txt2:#98a2b3; --acento:#f5a524; --azul:#3d7dff; --ok:#37b169; --erro:#e5484d;
    --panel:rgba(20,23,29,.82); --hdr-bg:rgba(14,16,20,.78); --nav-bg:rgba(14,16,20,.94);
    --hdr:54px; --nav:62px; --r:16px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef1f5; --card:#fff; --card2:#f3f4f7; --linha:rgba(0,0,0,.08);
           --txt:#12151a; --txt2:#5c6472; --panel:rgba(255,255,255,.86);
           --hdr-bg:rgba(255,255,255,.8); --nav-bg:rgba(255,255,255,.95); }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--txt);
       font:15px/1.45 "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  svg.ic{width:20px;height:20px;fill:currentColor;display:block}
  .glass{background:var(--panel);backdrop-filter:blur(18px) saturate(140%);
         -webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--linha)}

  /* ---------- topo ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;
         padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--hdr-bg);
         backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
         border-bottom:1px solid var(--linha)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:32px;height:32px;border-radius:10px;background:var(--acento);color:#20160a;
               display:grid;place-items:center;flex:0 0 auto;box-shadow:0 3px 10px rgba(245,165,36,.35)}
  .brand .logo svg{width:20px;height:20px}
  .brand h1{font-size:15.5px;margin:0;font-weight:650;letter-spacing:-.2px}
  .brand .sub{font-size:11.5px;color:var(--txt2);max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status{margin-left:auto;display:flex;align-items:center;gap:8px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:middle}
  .dot.off{background:var(--erro)}

  /* ---------- mapa em tela cheia ---------- */
  #s-mapa{display:none}
  #s-mapa.on{position:fixed;inset:0;z-index:1;display:block}
  #mapa{position:absolute;inset:0;background:#20242c}
  .leaflet-container{background:#20242c;font:inherit}
  .leaflet-control-attribution{font-size:9.5px}
  .leaflet-bottom{bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px)}
  .map-pills{position:absolute;z-index:22;left:14px;right:14px;
             top:calc(var(--hdr) + env(safe-area-inset-top) + 10px);display:flex;gap:8px}
  .map-controls{position:absolute;z-index:22;right:14px;
                top:calc(var(--hdr) + env(safe-area-inset-top) + 54px);
                display:flex;gap:8px}

  /* ---------- botões flutuantes / pills ---------- */
  .fab{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;cursor:pointer;
       color:var(--txt);box-shadow:0 6px 18px rgba(0,0,0,.32);transition:transform .12s ease,background .15s}
  .fab:active{transform:scale(.94)}
  .fab.acento{background:var(--acento);color:#20160a;border-color:transparent}
  .pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;
        padding:7px 12px;color:var(--txt);box-shadow:0 4px 14px rgba(0,0,0,.22)}
  .pill.ok{color:var(--ok)}
  .meta{font-size:12.5px;color:var(--txt2)}

  /* ---------- painel lateral de detalhes (mapa) ---------- */
  .detail{position:absolute;z-index:25;left:12px;right:12px;
          bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);
          border-radius:20px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);
          max-height:56vh;overflow:auto;animation:sobe .2s cubic-bezier(.2,.7,.3,1)}
  @keyframes sobe{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
  .detail h2{font-size:15px;margin:0 0 10px;font-weight:680;display:flex;align-items:center;gap:8px}
  .detail .linha-titulo{display:flex;align-items:center;gap:10px}
  .badge-linha{width:34px;height:34px;border-radius:11px;background:var(--azul);color:#fff;display:grid;
               place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
  .prox-parada{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--linha)}
  .prox-parada .bola{width:9px;height:9px;border-radius:50%;background:var(--azul);flex:0 0 auto}
  .prox-parada .eta{margin-left:auto;font-weight:650;color:var(--txt)}
  .btn-x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);
         border:1px solid var(--linha);color:var(--txt);cursor:pointer;flex:0 0 auto}

  /* ---------- menus (rail desktop + nav mobile) ---------- */
  .tab-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:none;
           color:var(--txt2);cursor:pointer;font:inherit;transition:.15s}
  .tab-btn.on{color:var(--acento)}
  .rail{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:space-around;
      padding-bottom:env(safe-area-inset-bottom);background:var(--nav-bg);
      backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
      border-top:1px solid var(--linha)}
  nav .tab-btn{flex:1;flex-direction:column;gap:3px;font:600 10.5px/1 inherit;padding:9px 2px 7px}
  nav .tab-btn .ic{width:22px;height:22px}
  nav .tab-btn.on{color:var(--acento)}

  /* ---------- conteúdo ---------- */
  main{padding:calc(var(--hdr) + env(safe-area-inset-top) + 12px) 14px
                calc(var(--nav) + env(safe-area-inset-bottom) + 22px)}
  main section{display:none}
  main section.on{display:block}

  .card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:15px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;font-weight:650;display:flex;align-items:center;gap:8px}
  .card h2 .tag{margin-left:auto;font-size:12px;color:var(--txt2);font-weight:500}
  label.f{display:block;font-size:12.5px;color:var(--txt2);margin:10px 0 4px}
  input,select,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--linha);
        border-radius:11px;padding:11px 12px;font-size:16px;font-family:inherit}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--linha);
        border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;user-select:none}
  .chip.on{background:rgba(245,165,36,.16);border-color:var(--acento);color:var(--txt)}
  .chip input{display:none}
  button.bt{border:none;border-radius:11px;padding:11px 15px;font-size:14px;font-weight:600;cursor:pointer;
            background:var(--acento);color:#20160a}
  button.bt.sec{background:var(--card2);color:var(--txt);border:1px solid var(--linha)}
  button.bt.del{background:transparent;color:var(--erro);border:1px solid var(--linha);padding:7px 11px;font-size:12.5px}
  button.bt.sm{padding:8px 11px;font-size:12.5px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--linha);border-radius:12px;
        margin-bottom:8px;background:var(--card2)}
  .item .nome{font-weight:600}
  .item .meta{font-size:12px;color:var(--txt2)}
  .item .dir{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .log{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:260px;overflow:auto}
  .log div{padding:3px 0;border-bottom:1px solid var(--linha);color:var(--txt2)}
  .log b{color:var(--txt);font-weight:500}
  .vazio{color:var(--txt2);font-size:13.5px;text-align:center;padding:14px}
  .aviso{font-size:13px;border-radius:11px;padding:10px 12px;margin-top:10px;display:none}
  .aviso.ok{background:rgba(55,177,105,.14);color:var(--ok);display:block}
  .aviso.erro{background:rgba(229,72,77,.14);color:var(--erro);display:block}

  /* marcador de ônibus */
  .busmark{position:relative;width:0;height:0}
  .busmark .b{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;
              background:var(--acento);color:#20160a;display:grid;place-items:center;border:2px solid #fff;
              box-shadow:0 3px 10px rgba(0,0,0,.5)}
  .busmark.parado .b{background:#8a94a6;color:#0f1115}
  .busmark.sel .b{background:var(--azul);color:#fff;border-color:#fff}
  .busmark svg{width:19px;height:19px;fill:currentColor}
  .busmark .l{position:absolute;top:17px;left:50%;transform:translateX(-50%);background:#12151a;color:#fff;
              font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:7px;white-space:nowrap;
              border:1px solid rgba(255,255,255,.28)}

  /* ---------- desktop ---------- */
  @media (min-width: 900px){
    /* o mapa fica sempre visível; o painel de opções abre por cima */
    #s-mapa{position:fixed;inset:0;z-index:1;display:block}
    main{position:fixed;z-index:40;left:104px;top:calc(var(--hdr) + env(safe-area-inset-top) + 16px);
         bottom:18px;width:min(460px, calc(100vw - 560px));margin:0;padding:16px;overflow:auto;
         border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:none}
    body:not([data-tab="mapa"]) main{display:block}
    nav{display:none}

    /* trilha de navegação vertical */
    .rail{position:fixed;z-index:45;left:16px;top:50%;transform:translateY(-50%);display:flex;
          flex-direction:column;gap:4px;padding:8px;border-radius:20px;
          box-shadow:0 18px 46px rgba(0,0,0,.4)}
    .rail .tab-btn{flex-direction:column;gap:3px;width:62px;height:56px;border-radius:14px;
                   font:600 9.5px/1 inherit}
    .rail .tab-btn .ic{width:22px;height:22px}
    .rail .tab-btn.on{background:var(--acento);color:#20160a}

    .map-pills{left:104px;right:auto}
    .map-controls{flex-direction:column;top:calc(var(--hdr) + env(safe-area-inset-top) + 16px);
                  right:18px;left:auto}
    .detail{left:auto;right:18px;top:calc(var(--hdr) + env(safe-area-inset-top) + 200px);
            bottom:auto;width:370px;max-height:calc(100vh - 300px)}
    .leaflet-bottom{bottom:10px}
  }
</style>
</head>

<header>
  <div class="brand">
    <span class="logo"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-bus"/></svg></span>
    <div style="min-width:0">
      <h1>Bus Tracker</h1>
      <div class="sub" id="hdr-sub">carregando…</div>
    </div>
  </div>
  <div class="status">
    <span class="pill glass"><span class="dot off" id="dot"></span><span id="hdr-ha">HA</span></span>
    <span class="pill glass" id="hdr-ciclo">—</span>
  </div>
</header>

<aside class="rail glass">
  <button class="tab-btn on" data-t="mapa"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-map"/></svg>Mapa</button>
  <button class="tab-btn" data-t="onibus"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-bus"/></svg>Ônibus</button>
  <button class="tab-btn" data-t="avisos"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-bell"/></svg>Avisos</button>
  <button class="tab-btn" data-t="pessoas"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-account"/></svg>Pessoas</button>
  <button class="tab-btn" data-t="ajustes"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-cog"/></svg>Ajustes</button>
</aside>

<!-- ============================= MAPA ============================= -->
<section id="s-mapa" class="on">
  <div id="mapa"></div>
  <div class="map-pills">
    <span class="pill glass" id="m-onibus">0 ônibus</span>
    <span class="pill glass" id="m-pessoas">0 pessoas</span>
  </div>
  <div class="map-controls">
    <button class="fab glass" onclick="carregarMapa(true)" title="Atualizar"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-refresh"/></svg></button>
    <button class="fab glass" onclick="mostrarTudo()" title="Mostrar tudo"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-eye"/></svg></button>
    <button class="fab glass" onclick="togglePontos()" title="Pontos de embarque"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-marker"/></svg></button>
  </div>
  <aside class="detail glass" id="rota-info" style="display:none"></aside>
  <aside class="detail glass" id="pontos-sheet" style="display:none">
    <h2>Pontos de embarque
      <button class="btn-x" style="margin-left:auto" onclick="togglePontos()"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-close"/></svg></button>
    </h2>
    <div id="lista-pontos"></div>
  </aside>
</section>

<main>
  <!-- ============================ ÔNIBUS ============================ -->
  <section id="s-onibus">
    <div class="card">
      <h2>Cidade</h2>
      <label class="f">Sistema SIUMobile</label>
      <select id="cid-sel"></select>
      <details id="cid-custom" style="margin-top:8px">
        <summary class="f" style="cursor:pointer">Outra cidade (URL/praça/pacote)</summary>
        <label class="f">URL base da API</label>
        <input id="cid-base" placeholder="http://minha-cidade.siumobile.com.br:6060/.../rest/ws">
        <label class="f">Praça (cidade)</label>
        <input id="cid-praca" placeholder="BHZ">
        <label class="f">Pacote do app</label>
        <input id="cid-pacote" placeholder="com.tacom.siumobilebh">
      </details>
      <div class="row"><button class="bt" onclick="salvarCidade()">Aplicar cidade</button></div>
      <div class="aviso" id="cid-msg"></div>
    </div>
    <div class="card">
      <h2>O que exibir no mapa<span class="tag" id="tag-obs"></span></h2>
      <label class="f">Linhas</label>
      <div class="chips" id="chips-linhas"></div>
      <label class="f">Pessoas</label>
      <div class="chips" id="chips-pessoas"></div>
      <div class="row"><button class="bt" onclick="salvarMapa()">Salvar exibição</button></div>
    </div>
    <div class="card">
      <h2>Ônibus ao vivo<span class="tag" id="tag-qtd"></span></h2>
      <div id="lista-onibus"></div>
    </div>
  </section>

  <!-- ============================ AVISOS ============================ -->
  <section id="s-avisos">
    <div class="card">
      <h2 id="av-titulo">Novo aviso</h2>
      <label class="f">Linha</label>
      <select id="av-linha"></select>
      <label class="f">Avisar quem</label>
      <div class="chips" id="av-pessoas"></div>
      <label class="f">Dias da semana</label>
      <div class="chips" id="av-dias"></div>
      <div class="grid2">
        <div><label class="f">A partir de</label><input type="time" id="av-inicio" value="06:30"></div>
        <div><label class="f">Até</label><input type="time" id="av-fim" value="07:10"></div>
      </div>
      <div class="row">
        <label class="chip" id="av-ativo-wrap"><input type="checkbox" id="av-ativo" checked> Ativo</label>
      </div>
      <div class="row">
        <button class="bt" onclick="salvarRegra()">Salvar aviso</button>
        <button class="bt sec" onclick="novaRegra()">Limpar</button>

  <!-- =========================== PESSOAS =========================== -->
  <section id="s-pessoas">

<script src="vendor/leaflet.js"></script>
<script>
/* O painel roda dentro do ingress do HA (/api/hassio_ingress/<token>/),
   então TODO caminho daqui para baixo precisa ser relativo. */
const BASE = location.pathname.replace(/\/$/, "") + "/";
const DIAS = ["seg","ter","qua","qui","sex","sáb","dom"];
let est = {ajustes:{},pessoas:[],regras:[],mapa:{},linhas:[],ha:{}};
let mapa, camadaOnibus, camadaOutros, rotaSelLayer;
let mkOnibus = {};
let onibusSel = null, rotaAjustada = false;
let editandoRegra = null, editandoPessoa = null;
let selLinhas = new Set(), selPessoas = new Set();

/* ------------------------------------------------ navegação */
function trocarAba(t){
  document.body.dataset.tab = t;
  document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("on", x.dataset.t===t));
  document.querySelectorAll("main section").forEach(x=>x.classList.toggle("on", x.id==="s-"+t));
  const secMapa = document.getElementById("s-mapa");
  if (t==="mapa"){ secMapa.classList.add("on"); setTimeout(()=>mapa && mapa.invalidateSize(), 80); }
  else secMapa.classList.remove("on");   // no desktop o CSS mantém o mapa visível
  if (t==="onibus") carregarOnibus();
}
document.querySelectorAll(".tab-btn").forEach(b=>{ b.onclick = ()=>trocarAba(b.dataset.t); });

function msg(id, texto, ok=true){
  const el = document.getElementById(id);
  el.className = "aviso " + (ok?"ok":"erro");
  el.textContent = texto;
  setTimeout(()=>{ el.className = "aviso"; }, 5000);
}
async function api(url, dados){
  const alvo = BASE + String(url).replace(/^\//, "");
  const r = await fetch(alvo, dados ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(dados)} : undefined);
  return await r.json();
}
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDist = m => m==null ? "?" : (m>=1000 ? (m/1000).toFixed(1)+" km" : Math.round(m)+" m");
const fmtHora = ts => ts ? new Date(ts*1000).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "—";

/* ------------------------------------------------ estado geral */
async function carregarEstado(){
  est = await api("/api/estado");
  const nomeCidade = (est.cidade && est.cidade.nome) ? est.cidade.nome + " · " : "";
  document.getElementById("hdr-sub").textContent =
    nomeCidade + ((est.linhas_observadas||[]).join(" · ") || "nenhuma linha configurada");
  renderMapaChips(); renderPessoas(); renderRegras(); renderAjustes(); preencherSelects(); renderCidade();
  const st = est.status||{};
  document.getElementById("dot").className = "dot" + (st.escutador?"":" off");
  document.getElementById("hdr-ha").textContent = st.escutador ? "ao vivo" : "sem eventos";
  document.getElementById("hdr-ciclo").textContent = st.ultimo_ciclo ? "leitura "+fmtHora(st.ultimo_ciclo) : "aguardando";
  document.getElementById("tag-obs").textContent = (st.onibus||0)+" no mapa";
  document.getElementById("tag-rastreios").textContent = (st.rastreios||0)+" ativo(s)";
  if (st.usuario) document.getElementById("hdr-ciclo").textContent += " · "+st.usuario;
}

function preencherSelects(){
  const sel = document.getElementById("av-linha");
  const atual = sel.value;
  sel.innerHTML = '<option value="">— escolha a linha —</option>' + (est.linhas||[]).map(l=>
    `<option value="${esc(l.sigla)}">${esc(l.sigla)} · ${esc(l.nome)}</option>`).join("");
  sel.value = atual;

  const nots = (est.ha&&est.ha.notificacoes)||[];
  const peN = document.getElementById("pe-notify");
  const atualN = peN.value;
  peN.innerHTML = '<option value="">— escolha o celular —</option>' + nots.map(n=>
    `<option value="notify.${esc(n.servico)}">${esc(n.nome)}</option>`).join("");
  peN.value = atualN;

  const pes = (est.ha&&est.ha.pessoas)||[], ras = (est.ha&&est.ha.rastreadores)||[];
  const opc = [
    ...pes.map(p=>`<option value="${esc(p.entity_id)}">${esc(p.nome)} (pessoa)</option>`),
    ...ras.filter(r=>r.tem_gps).map(r=>`<option value="${esc(r.entity_id)}">${esc(r.nome)} (rastreador)</option>`)
  ];
  const peE = document.getElementById("pe-entidade");
  const atualE = peE.value;
  peE.innerHTML = '<option value="">— sem localização —</option>' + opc.join("");
  peE.value = atualE;
}

/* ------------------------------------------------ cidade */
function renderCidade(){
  const sel = document.getElementById("cid-sel");
  if (!sel) return;
  const cidades = est.cidades || {};
  const atual = (est.cidade && est.cidade.chave) || "";
  sel.innerHTML = Object.keys(cidades).map(k=>
      `<option value="${esc(k)}"${k===atual?" selected":""}>${esc(cidades[k])}</option>`).join("")
    + `<option value="custom"${atual==="custom"?" selected":""}>Outra cidade…</option>`;
  const c = est.cidade || {};
  document.getElementById("cid-base").value = (atual==="custom" ? (c.base||"") : "");
  document.getElementById("cid-praca").value = (atual==="custom" ? (c.praca||"") : "");
  document.getElementById("cid-pacote").value = (atual==="custom" ? (c.pacote||"") : "");
}
async function salvarCidade(){
  const chave = document.getElementById("cid-sel").value;
  const corpo = {cidade: chave};
  if (chave === "custom") {
    corpo.api_base = document.getElementById("cid-base").value.trim();
    corpo.api_praca = document.getElementById("cid-praca").value.trim();
    corpo.app_package = document.getElementById("cid-pacote").value.trim();
  }
  const r = await api("/api/cidade", corpo);
  if (r.ok){
    msg("cid-msg", "Cidade aplicada: " + ((r.cidade && r.cidade.nome) || ""));
    await carregarEstado(); carregarMapa(); carregarOnibus();
  } else msg("cid-msg", r.erro||"erro ao aplicar a cidade", false);
}

/* ------------------------------------------------ mapa */
const BUS_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18,11H6V6H18M16.5,17A1.5,1.5 0 0,1 15,15.5A1.5,1.5 0 0,1 16.5,14A1.5,1.5 0 0,1 18,15.5A1.5,1.5 0 0,1 16.5,17M7.5,17A1.5,1.5 0 0,1 6,15.5A1.5,1.5 0 0,1 7.5,14A1.5,1.5 0 0,1 9,15.5A1.5,1.5 0 0,1 7.5,17M4,16C4,16.88 4.39,17.67 5,18.22V20A1,1 0 0,0 6,21H7A1,1 0 0,0 8,20V19H16V20A1,1 0 0,0 17,21H18A1,1 0 0,0 19,20V18.22C19.61,17.67 20,16.88 20,16V6C20,2.5 16.42,2 12,2C7.58,2 4,2.5 4,6V16Z"/></svg>';
function busIcon(b, sel){
  const cls = (b.em_movimento ? "" : " parado") + (sel ? " sel" : "");
  const vel = b.vel_kmh ? ` · ${Math.round(b.vel_kmh)}` : "";
  const html = `<div class="busmark${cls}"><div class="b">${BUS_SVG}</div><div class="l">${esc(b.linha)}${vel}</div></div>`;
  return L.divIcon({className:"", html, iconSize:[0,0]});
}
function popupBus(b){
  const vel = b.vel_kmh ? ` · ${Math.round(b.vel_kmh)} km/h` : "";
  return `<b>Linha ${esc(b.linha)}</b><br>Veículo ${esc(b.id)}<br>${b.em_movimento?"em movimento":"parado"}${vel}<br><i>Toque para ver a rota</i>`;
}
function centroMapa(){
  return (est.cidade && est.cidade.centro) || [-12.2664,-38.9663];
}
function iniciarMapa(){
  if (mapa) return;
  mapa = L.map("mapa", {zoomControl:false, attributionControl:true}).setView(centroMapa(), 13);
  L.control.zoom({position:"bottomright"}).addTo(mapa);
  L.tileLayer(BASE + "api/tile/{z}/{x}/{y}.png", {
    maxZoom:19, attribution:"© OpenStreetMap"
  }).addTo(mapa);
  camadaOnibus = L.layerGroup().addTo(mapa);
  camadaOutros = L.layerGroup().addTo(mapa);
  rotaSelLayer = L.layerGroup().addTo(mapa);
  mapa.on("click", limparSelecao);
}

async function carregarMapa(primeiro){
  iniciarMapa();
  const d = await api("/api/mapa");
  const norm = s => String(s||"").replace(/^0+/,"") || "0";
  const sel = new Set((est.mapa.onibus||[]).map(norm));
  const exibidos = (d.onibus||[]).filter(b=> sel.size===0 || sel.has(norm(b.linha)));

  const vistos = new Set();
  exibidos.forEach(b=>{
    vistos.add(b.id);
    const e = mkOnibus[b.id];
    if (!e){
      const mk = L.marker([b.lat,b.lon], {icon:busIcon(b, b.id===onibusSel), bubblingMouseEvents:false});
      mk.bindPopup(popupBus(b));
      mk.on("click", ()=>selecionarOnibus(b.id));
      mkOnibus[b.id] = {mk, b};
      camadaOnibus.addLayer(mk);
    } else {
      e.b = b;
      e.mk.setLatLng([b.lat,b.lon]);
      e.mk.setIcon(busIcon(b, b.id===onibusSel));
      if (e.mk.getPopup()) e.mk.setPopupContent(popupBus(b));
    }
  });
  Object.keys(mkOnibus).forEach(id=>{
    if (!vistos.has(id)){ camadaOnibus.removeLayer(mkOnibus[id].mk); delete mkOnibus[id]; }
  });

  camadaOutros.clearLayers();
  (d.lugares||[]).forEach(p=>{
    camadaOutros.addLayer(L.circleMarker([p.lat,p.lon], {radius:9, color:"#3d7dff", weight:3, fillColor:"#3d7dff", fillOpacity:.35})
      .bindPopup(`<b>${esc(p.nome)}</b>`));
  });
  (d.pontos||[]).forEach(p=>{
    camadaOutros.addLayer(L.circleMarker([p.lat,p.lon], {radius:7, color:"#f5a524", weight:2, fillColor:"#f5a524", fillOpacity:.5})
      .bindPopup(`<b>${esc(p.nome)}</b><br>para ${esc(p.pessoa)} · linha ${esc(p.linha)}<br>${fmtDist(p.dist_pessoa)} da pessoa`));
  });
  const rotas = d.rotas||{};
  Object.keys(rotas).forEach(sigla=>{
    rotas[sigla].forEach(pts=>{
      if (pts.length>1) camadaOutros.addLayer(L.polyline(pts, {color:"#f5a524", weight:2, opacity:.35, dashArray:"1 6" }));
    });
  });

  document.getElementById("m-onibus").textContent = (d.onibus||[]).length+" ônibus";
  document.getElementById("m-pessoas").textContent = (d.lugares||[]).length+" pessoas";
  const pts = d.pontos||[];
  document.getElementById("lista-pontos").innerHTML = pts.length ? pts.map(p=>
    `<div class="item"><div><div class="nome">${esc(p.nome)}</div>
     <div class="meta">linha ${esc(p.linha)} · para ${esc(p.pessoa)} · ${fmtDist(p.dist_pessoa)} da pessoa</div></div></div>`
  ).join("") : '<div class="vazio">Nenhum ponto calculado ainda. Os pontos aparecem quando o app localiza a parada da linha mais próxima de cada pessoa.</div>';
  if (primeiro && exibidos.length===0) mapa.setView(centroMapa(), 13);
  if (onibusSel) desenharRotaSel();
}

/* ------------------------------------------------ rota do ônibus selecionado */
const nomeCurto = s => { s = String(s||""); return s.length>42 ? s.slice(0,41).trim()+"…" : s; };
const textoEta = p => p.passou ? "já passou" : (p.prev ? esc(p.prev) : (p.eta_min!=null ? "~"+Math.round(p.eta_min)+" min" : "?"));
function pintarSelecao(){
  Object.values(mkOnibus).forEach(e=> e.mk.setIcon(busIcon(e.b, e.b.id===onibusSel)));
}
async function selecionarOnibus(id){
  onibusSel = id;
  rotaAjustada = false;
  pintarSelecao();
  await desenharRotaSel();
}
async function desenharRotaSel(){
  if (!rotaSelLayer) return;
  if (!onibusSel){ rotaSelLayer.clearLayers(); return; }
  let d;
  try { d = await api("/api/onibus/"+encodeURIComponent(onibusSel)); }
  catch(e){ return; }
  if (!d || !d.ok){ limparSelecao(); return; }
  const o = d.onibus||{}, paradas = d.paradas||[];

  const grupo = L.layerGroup();
  let bounds = null;
  if ((d.rota||[]).length > 1){
    const pl = L.polyline(d.rota, {color:"#3d7dff", weight:5, opacity:.85, bubblingMouseEvents:false}).addTo(grupo);
    bounds = pl.getBounds();
  }
  paradas.forEach(p=>{
    const cor = p.passou ? "#8a94a6" : "#3d7dff";
    L.circleMarker([p.lat,p.lon], {radius:5, color:cor, weight:2, fillColor:"#fff", fillOpacity:.9, bubblingMouseEvents:false})
      .bindPopup(`<b>${esc(p.nome)}</b>` + (p.passou ? "" : `<br>${textoEta(p)}${p.dist_m!=null?" · "+fmtDist(p.dist_m):""}`))
      .addTo(grupo);
  });
  rotaSelLayer.clearLayers();
  grupo.eachLayer(l=>rotaSelLayer.addLayer(l));

  const prox = paradas.filter(p=>!p.passou)
    .sort((a,b)=>(a.eta_min==null?1e9:a.eta_min)-(b.eta_min==null?1e9:b.eta_min)).slice(0,6);
  const info = document.getElementById("rota-info");
  const extras = [];
  if (o.sentido) extras.push(esc(o.sentido));
  if (o.acessivel===true) extras.push("♿ acessível");
  info.style.display = "block";
  info.innerHTML = `
    <h2><span class="badge-linha">${esc(o.linha)}</span>
      <span>Linha ${esc(o.linha)} · veículo ${esc(o.id)}</span>
      <button class="btn-x" style="margin-left:auto" onclick="limparSelecao()"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-close"/></svg></button>
    </h2>
    <div class="meta">${extras.join(" · ")}</div>
    ${o.destino ? `<div class="meta" style="margin-top:4px">Destino: <b style="color:var(--txt)">${esc(o.destino)}</b></div>` : ""}
    ${prox.length ? `<div class="meta" style="margin:10px 0 2px;font-weight:650;color:var(--txt)">Próximas paradas</div>` +
      prox.map(p=>`<div class="prox-parada"><span class="bola"></span>
        <span style="min-width:0">${esc(nomeCurto(p.nome))}<br><span class="meta">${fmtDist(p.dist_m)}</span></span>
        <span class="eta">${textoEta(p)}</span></div>`).join("")
      : '<div class="meta" style="margin-top:8px">Sem paradas previstas.</div>'}`;
  if (bounds && !rotaAjustada){ mapa.fitBounds(bounds, {padding:[40,40]}); rotaAjustada = true; }
}
function limparSelecao(){
  onibusSel = null;
  rotaAjustada = false;
  if (rotaSelLayer) rotaSelLayer.clearLayers();
  const info = document.getElementById("rota-info");
  if (info) info.style.display = "none";
  pintarSelecao();
}
function togglePontos(){
  const el = document.getElementById("pontos-sheet");
  el.style.display = (el.style.display==="block") ? "none" : "block";
}

function mostrarTudo(){
  const linhas = [...new Set((dadosOnibus||[]).map(b=>b.linha))];
  selLinhas = new Set(linhas); selPessoas = new Set(est.pessoas.map(p=>p.id));
  salvarMapa();
}

/* ------------------------------------------------ ônibus */
function chips(container, itens, selecionados, aoAlternar){
  const cx = document.getElementById(container);
  cx.innerHTML = itens.length ? itens.map(it=>`<label class="chip ${selecionados.has(it.id)?"on":""}" data-id="${esc(it.id)}">
     <input type="checkbox" ${selecionados.has(it.id)?"checked":""}>${esc(it.rotulo)}</label>`).join("")
    : '<div class="vazio">Nada para escolher ainda.</div>';
  cx.querySelectorAll(".chip").forEach(c=>{
    c.onclick = e=>{
      e.preventDefault();
      const id = c.dataset.id;
      if (selecionados.has(id)) selecionados.delete(id); else selecionados.add(id);
      c.classList.toggle("on", selecionados.has(id));
      c.querySelector("input").checked = selecionados.has(id);
      if (aoAlternar) aoAlternar();
    };
  });
}
function renderMapaChips(){
  const todas = new Set([...(est.linhas||[]).map(l=>l.sigla), ...(est.linhas_observadas||[])]);
  selLinhas = new Set(est.mapa.onibus||[]);
  chips("chips-linhas", [...todas].sort().map(s=>({id:s, rotulo:s})), selLinhas);
  selPessoas = new Set(est.mapa.pessoas||[]);
  chips("chips-pessoas", (est.pessoas||[]).map(p=>({id:p.id, rotulo:p.nome})), selPessoas);
}
let dadosOnibus = [];
async function carregarOnibus(){
  const d = await api("/api/mapa");
  dadosOnibus = d.onibus||[];
  document.getElementById("tag-qtd").textContent = dadosOnibus.length+" em circulação";
  const porLinha = {};
  dadosOnibus.forEach(b=>{ (porLinha[b.linha] = porLinha[b.linha]||[]).push(b); });
  const chaves = Object.keys(porLinha).sort();
  document.getElementById("lista-onibus").innerHTML = chaves.length ? chaves.map(l=>
    `<div style="margin-bottom:10px"><div class="meta" style="font-weight:600;margin-bottom:6px">Linha ${esc(l)}</div>`+
    porLinha[l].map(b=>`<div class="item"><div>
        <div class="nome">Veículo ${esc(b.id)}</div>
        <div class="meta">${b.em_movimento?"em movimento":"parado"}${b.vel_kmh?" · "+Math.round(b.vel_kmh)+" km/h":""} · visto ${b.visto_ha_s}s atrás</div>
      </div><div class="dir">
        <button class="bt sec sm" onclick="rastrear('${esc(l)}','${esc(b.id)}')">Rastrear</button>
      </div></div>`).join("")+"</div>"
  ).join("") : '<div class="vazio">Nenhum ônibus no mapa agora. Os ônibus aparecem durante o horário de operação.</div>';
}
function rastrear(linha, bus){
  const ps = est.pessoas.filter(p=>p.ativo!==false);
  if (!ps.length){ alert("Cadastre uma pessoa primeiro (aba Pessoas)."); return; }
  const nome = prompt("Rastrear para quem?\n" + ps.map((p,i)=>`${i+1}) ${p.nome}`).join("\n"), "1");
  const idx = parseInt(nome,10)-1;
  if (isNaN(idx) || !ps[idx]) return;
  api("/api/rastrear/"+ps[idx].id+"/"+encodeURIComponent(linha)+"/"+encodeURIComponent(bus), {}).then(()=>{
    carregarEstado();
    alert("Rastreio iniciado para "+ps[idx].nome+".");
  });
}

async function salvarMapa(){
  await api("/api/mapa", {onibus:[...selLinhas], pessoas:[...selPessoas], rotas:true, pontos:true});
  await carregarEstado(); carregarMapa();
}

/* ------------------------------------------------ avisos */
function renderRegras(){
  const el = document.getElementById("lista-regras");
  if (!(est.regras||[]).length){ el.innerHTML = '<div class="vazio">Nenhum aviso configurado ainda.</div>'; return; }
  el.innerHTML = est.regras.map(r=>{
    const nomes = (r.pessoas||[]).map(id => (est.pessoas.find(p=>p.id===id)||{}).nome || id).join(", ");
    const dias = (r.dias||[]).length===7 ? "todos os dias" : (r.dias||[]).map(d=>DIAS[d]).join(" ");
    return `<div class="item"><div>
      <div class="nome">Linha ${esc(r.linha)} → ${esc(nomes)}</div>
      <div class="meta">${esc(dias)} · ${esc(r.inicio)}–${esc(r.fim)}</div>
    </div><div class="dir">
      <span class="pill ${r.ativo?"ok":""}">${r.ativo?"ativo":"pausado"}</span>
      <button class="bt sec sm" onclick="editarRegra('${r.id}')">Editar</button>
      <button class="bt del" onclick="apagarRegra('${r.id}')">Excluir</button>
    </div></div>`;
  }).join("");
}
function renderDiasChips(sel){
  const cx = document.getElementById("av-dias");
  cx.innerHTML = DIAS.map((d,i)=>`<label class="chip ${sel.includes(i)?"on":""}" data-d="${i}">
     <input type="checkbox" ${sel.includes(i)?"checked":""}>${d}</label>`).join("");
  cx.querySelectorAll(".chip").forEach(c=>{
    c.onclick = e=>{ e.preventDefault(); c.classList.toggle("on"); c.querySelector("input").checked = c.classList.contains("on"); };
  });
}
function renderPessoasChips(sel){
  const cx = document.getElementById("av-pessoas");
  cx.innerHTML = (est.pessoas||[]).map(p=>`<label class="chip ${sel.includes(p.id)?"on":""}" data-p="${p.id}">
      <input type="checkbox" ${sel.includes(p.id)?"checked":""}>${esc(p.nome)}</label>`).join("") ||
    '<div class="vazio">Cadastre uma pessoa na aba Pessoas.</div>';
  cx.querySelectorAll(".chip").forEach(c=>{
    c.onclick = e=>{ e.preventDefault(); c.classList.toggle("on"); c.querySelector("input").checked = c.classList.contains("on"); };
  });
}
function novaRegra(){
  editandoRegra = null;
  document.getElementById("av-titulo").textContent = "Novo aviso";
  document.getElementById("av-linha").value = "";
  document.getElementById("av-inicio").value = "06:30";
  document.getElementById("av-fim").value = "07:10";
  document.getElementById("av-ativo").checked = true;
  renderPessoasChips([]); renderDiasChips([1,2,3,4,5]);
}
function editarRegra(id){
  const r = est.regras.find(x=>x.id===id); if (!r) return;
  editandoRegra = id;
  document.getElementById("av-titulo").textContent = "Editando aviso · linha "+r.linha;
  document.getElementById("av-linha").value = r.linha;
  document.getElementById("av-inicio").value = r.inicio;
  document.getElementById("av-fim").value = r.fim;
  document.getElementById("av-ativo").checked = !!r.ativo;
  renderPessoasChips(r.pessoas||[]); renderDiasChips(r.dias||[]);
  document.getElementById("s-avisos").scrollIntoView({behavior:"smooth"});
}
async function salvarRegra(){
  const dias = [...document.querySelectorAll("#av-dias .chip.on")].map(c=>parseInt(c.dataset.d,10));
  const pessoas = [...document.querySelectorAll("#av-pessoas .chip.on")].map(c=>c.dataset.p);
  const regra = {
    id: editandoRegra, ativo: document.getElementById("av-ativo").checked,
    linha: document.getElementById("av-linha").value,
    pessoas, dias,
    inicio: document.getElementById("av-inicio").value,
    fim: document.getElementById("av-fim").value
  };
  const r = await api("/api/regras", {regra});
  if (r.ok){ msg("av-msg","Aviso salvo."); novaRegra(); await carregarEstado(); }
  else msg("av-msg", r.erro||"erro ao salvar", false);
}
async function apagarRegra(id){
  if (!confirm("Excluir este aviso?")) return;
  await api("/api/regras/"+id, {});
  await carregarEstado();
}
async function testarAgora(){
  const linha = document.getElementById("av-linha").value;
  const pessoas = [...document.querySelectorAll("#av-pessoas .chip.on")].map(c=>c.dataset.p);
  if (!linha || !pessoas.length) return msg("av-msg","Escolha a linha e ao menos uma pessoa.", false);
  const r = await api("/api/agora", {pessoa: pessoas[0], linha});
  if (r.ok) msg("av-msg", `Enviado: veículo ${r.veiculo} a ${fmtDist(r.dist_ponto)} · ~${Math.round(r.eta_min)} min do ponto ${r.ponto.nome}.`);
  else msg("av-msg", r.erro||"não deu para testar agora", false);
}

/* ------------------------------------------------ pessoas */
function renderPessoas(){
  const el = document.getElementById("lista-pessoas");
  if (!(est.pessoas||[]).length){ el.innerHTML = '<div class="vazio">Nenhuma pessoa cadastrada.</div>'; return; }
  el.innerHTML = est.pessoas.map(p=>`<div class="item"><div>
      <div class="nome">${esc(p.nome)}</div>
      <div class="meta">${esc((p.notify||"").replace("notify.",""))} · ${esc(p.entidade||"sem localização")}</div>
    </div><div class="dir">
      <label class="chip ${p.ativo!==false?"on":""}" onclick="alternarPessoa('${p.id}')"><input type="checkbox" ${p.ativo!==false?"checked":""}>ativo</label>
      <button class="bt sec sm" onclick="testarPessoa('${p.id}')">Testar</button>
      <button class="bt sec sm" onclick="editarPessoa('${p.id}')">Editar</button>
      <button class="bt del" onclick="apagarPessoa('${p.id}')">Excluir</button>
    </div></div>`).join("");
}
function novaPessoa(){
  editandoPessoa = null;
  document.getElementById("pe-titulo").textContent = "Nova pessoa";
  ["pe-nome"].forEach(i=>document.getElementById(i).value="");
  document.getElementById("pe-notify").value = "";
  document.getElementById("pe-entidade").value = "";
}
function editarPessoa(id){
  const p = est.pessoas.find(x=>x.id===id); if(!p) return;
  editandoPessoa = id;
  document.getElementById("pe-titulo").textContent = "Editando "+p.nome;
  document.getElementById("pe-nome").value = p.nome;
  document.getElementById("pe-notify").value = p.notify||"";
  document.getElementById("pe-entidade").value = p.entidade||"";
  document.getElementById("s-pessoas").scrollIntoView({behavior:"smooth"});
}
async function salvarPessoa(){
  const pessoa = {
    id: editandoPessoa,
    nome: document.getElementById("pe-nome").value,
    notify: document.getElementById("pe-notify").value,
    entidade: document.getElementById("pe-entidade").value,
    ativo: true
  };
  const r = await api("/api/pessoas", {pessoa});
  if (r.ok){ msg("pe-msg","Pessoa salva."); novaPessoa(); await carregarEstado(); }
  else msg("pe-msg", r.erro||"erro", false);
}
async function apagarPessoa(id){
  if (!confirm("Excluir esta pessoa? Os avisos dela também são removidos.")) return;
  await api("/api/pessoas/"+id, {}); await carregarEstado();
}
async function testarPessoa(id){
  const r = await api("/api/teste/"+id, {});
  msg("pe-msg", r.ok ? "Notificação de teste enviada — olhe o celular." : (r.erro||"erro"), r.ok);
}
async function alternarPessoa(id){
  const p = est.pessoas.find(x=>x.id===id); if(!p) return;
  p.ativo = !(p.ativo!==false);
  await api("/api/pessoas", {pessoa:p}); await carregarEstado();
}

/* ------------------------------------------------ ajustes */
function renderAjustes(){
  const a = est.ajustes||{};
  document.getElementById("aj-limiar").value = a.limiar_aviso_m;
  document.getElementById("aj-cooldown").value = a.cooldown_min;
  document.getElementById("aj-vel").value = a.velocidade_min_kmh;
  document.getElementById("aj-intervalo").value = a.intervalo_segundos;
  document.getElementById("aj-rastreio").value = a.atualizacao_rastreio_s;
  document.getElementById("aj-fuso").value = a.fuso;
  document.getElementById("aj-sim").checked = !!a.simulacao;
}
async function salvarAjustes(){
  const r = await api("/api/ajustes", {
    limiar_aviso_m: +document.getElementById("aj-limiar").value,
    cooldown_min: +document.getElementById("aj-cooldown").value,
    velocidade_min_kmh: +document.getElementById("aj-vel").value,
    intervalo_segundos: +document.getElementById("aj-intervalo").value,
    atualizacao_rastreio_s: +document.getElementById("aj-rastreio").value,
    fuso: document.getElementById("aj-fuso").value,
    simulacao: document.getElementById("aj-sim").checked
  });
  msg("aj-msg", r.ok?"Ajustes salvos.":"erro", r.ok);
}
function renderRastreios(d){
  const el = document.getElementById("lista-rastreios");
  const r = (d && d.rastreios)||[];
  el.innerHTML = r.length ? r.map(x=>{
    const p = est.pessoas.find(p=>p.id===x.pessoa_id)||{nome:x.pessoa_id};
    return `<div class="item"><div><div class="nome">${esc(p.nome)} · linha ${esc(x.linha)}</div>
      <div class="meta">veículo ${esc(x.bus_id)} · desde ${fmtHora(x.inicio)} · início ${fmtDist(x.d0)}</div></div>
      <div class="dir"><button class="bt del" onclick="pararRastreio('${esc(x.pessoa_id)}')">Parar</button></div></div>`;
  }).join("") : '<div class="vazio">Nenhum rastreio em andamento.</div>';
}
async function pararRastreio(id){ await api("/api/parar/"+id, {}); carregarMapa(); }
function renderLog(d){
  const l = (d && d.log)||[];
  document.getElementById("log").innerHTML = l.length ? l.map(x=>
    `<div><b>${esc(x.hora)}</b> ${esc(x.msg)}</div>`).join("") : '<div class="vazio">Sem eventos.</div>';
}

/* ------------------------------------------------ laços */
async function laçoMapa(){
  try{
    const d = await api("/api/mapa");
    renderLog(d); renderRastreios(d);
  }catch(e){}
}
setInterval(()=>carregarMapa(), 12000);
setInterval(()=>{ if (document.getElementById("s-onibus").classList.contains("on")) carregarOnibus(); }, 12000);
setInterval(laçoMapa, 15000);
setInterval(carregarEstado, 60000);

(async function init(){
  await carregarEstado();
  novaRegra(); novaPessoa();
  await carregarMapa(true);
  carregarOnibus();
  laçoMapa();
})();
</script>
</body>
</html>
